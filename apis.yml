description: 'Sichuan Kelun-Biotech Biopharmaceutical Co., Ltd. (Kelun Botai, HKEX: 6990), a Chengdu-based
  subsidiary of Sichuan Kelun Pharmaceutical (SZSE: 002422) established in 2016, is an innovative biopharmaceutical
  company focused on the research, development, manufacturing, and commercialization of novel drugs. It
  specializes in antibody-drug conjugates (ADCs) and other conjugated therapies across both large-molecule
  and small-molecule modalities, targeting oncology and autoimmune diseases. The company operates several
  core drug-discovery platforms and maintains a pipeline of 30+ candidates with multiple approved and
  clinical-stage programs. It was surfaced as a portfolio company of idg-capital and added to the API
  Evangelist network; as a pharmaceutical manufacturer it publishes no public developer or API surface.'
